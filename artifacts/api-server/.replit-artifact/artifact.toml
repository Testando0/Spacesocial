kind = "api"
    previewPath = "/api"
    title = "API Server"
    version = "1.0.0"
    id = "3B4_FFSkEVBkAeYMFRJ2e"

    [[services]]
    localPort = 8080
    name = "API Server"
    paths = [
      "/api",
      "/register",
      "/login",
      "/chats",
      "/messages",
      "/user",
      "/users",
      "/stories",
      "/groups",
      "/friends",
      "/update-profile",
      "/update-password",
      "/uploads",
      "/avatars",
      "/socket.io",
      "/cinema",
      "/stickers",
      "/block",
      "/unblock",
      "/blocks",
      "/report",
      "/ban-status",
      "/appeal",
      "/admin",
    ]

    [services.development]
    run = "pnpm --filter @workspace/api-server run dev"

    [services.production]

    [services.production.build]
    args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

    [services.production.build.env]
    NODE_ENV = "production"

    [services.production.run]
    args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

    [services.production.run.env]
    PORT = "8080"
    NODE_ENV = "production"

    [services.production.health.startup]
    path = "/api/healthz"
  